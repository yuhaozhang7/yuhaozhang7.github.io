short_bio_text_justify: false
short_bio: >-
  <p>
    I am a PhD (DPhil) student in Engineering Science at the
    <a href="https://www.ox.ac.uk/" target="_blank">University of Oxford</a>, started in 2025, under the supervision of Prof.
    <a href="https://eng.ox.ac.uk/people/maurice-fallon/" target="_blank">Maurice Fallon</a>. My research interests lie in mobile robotics and spatial AI, particularly in semantic 3D dense mapping and information-driven planning for active robotic perception in unknown and evolving environments.
  </p>
  <p>
    Previously, I completed an MPhil in Advanced Computer Science at the
    <a href="https://www.cam.ac.uk/" target="_blank">University of Cambridge</a> (2024-2025), where I worked on multi-robot trajectory planning with denoising optimization under the supervision of Prof.
    <a href="https://www.cst.cam.ac.uk/people/asp45" target="_blank">Amanda Prorok</a>. Prior to that, I earned my Bachelor's degree in Computer Science from the
    <a href="https://www.manchester.ac.uk/" target="_blank">University of Manchester</a> (2021-2024), where I began research in Simultaneous Localization and Mapping with support from Prof.
    <a href="https://scholar.google.com/citations?user=X7USiLMAAAAJ&hl=en" target="_blank">Mikel Luján</a>.
  </p>
  <p>
    I have also had the privilege of collaborating with and receiving valuable guidance from Prof.
    <a href="https://dellaert.github.io/" target="_blank">Frank Dellaert</a>, Prof.
    <a href="https://yifutao.github.io/" target="_blank">Yifu Tao</a>, Dr.
    <a href="https://kei18.github.io/" target="_blank">Keisuke Okumura</a>, Dr.
    <a href="https://www.cl.cam.ac.uk/~as3233/" target="_blank">Ajay Shankar</a>, Dr.
    <a href="https://www.linkedin.com/in/ruiqi-ye-139482147/" target="_blank">Ruiqi Ye</a>, and
    <a href="https://www.linkedin.com/in/mihaibujanca/" target="_blank">Mihai Bujanca</a>.
  </p>

